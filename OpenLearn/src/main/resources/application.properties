spring.application.name=OpenLearn
file.upload-dir=./uploads
file.serve-path=/uploads/
# Set max file size to 100MB (default is 1MB)
spring.servlet.multipart.max-file-size=100MB
# Set max total request size to 100MB (default is 10MB)
spring.servlet.multipart.max-request-size=100MB
sendgrid.api.key=${sendgrid.api.key}

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/openlearn_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect